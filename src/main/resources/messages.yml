    <newline>
    <gradient:#FF4444:#FF8888><bold>     ZERAC - BLACKLIST GLOBAL</bold></gradient>
    <newline>
    <white>Has sido baneado <red><bold>globalmente</bold></red>
    <newline>
    <gray>  Razón: <red><reason>
    <gray>  Servidor: <white><server>
    <gray>  ID: <yellow>#<id>
    <newline>
    <dark_gray>Tu acceso fue revocado en todos los servidores
    <dark_gray>que utilizan la red ZERAC AntiCheat.
