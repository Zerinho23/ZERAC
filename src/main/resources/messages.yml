    <newline>
    <gradient:#FF4444:#FF8888><bold>  ZERAC - ACCESO DENEGADO</bold></gradient>
    <newline>
    <white>Estás en la <red><bold>Blacklist Global</bold></red> de ZERAC
    <newline>
    <gray>  Razón: <red><reason>
    <gray>  ID: <yellow>#<id>
    <newline>
    <aqua><bold>  discord.gg/zerac
