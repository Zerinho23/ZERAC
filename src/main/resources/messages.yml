# ╔══════════════════════════════════════════════════════════╗
# ║            ZERAC Messages Configuration                  ║
# ║    Uses MiniMessage format: https://docs.advntr.dev      ║
# ╚══════════════════════════════════════════════════════════╝

# Prefix used in all messages
prefix: "<gradient:#6C63FF:#A78BFA>[ZERAC]</gradient>"

# General messages
general:
  no-permission: "<prefix> <red>No tienes permiso para ejecutar esto."
  player-only: "<prefix> <red>Este comando es solo para jugadores."
  reload-success: "<prefix> <green>Configuración recargada correctamente."
  player-not-found: "<prefix> <red>Jugador no encontrado: <yellow><player></yellow>"

# Alert format (sent to staff)
alert:
  format: "<prefix> <gold><player></gold> <gray>detectado usando</gray> <red><check></red> <gray>(<multiplier>x)</gray> <dark_gray>—</dark_gray> <gray>VL:</gray> <yellow><vl></yellow><gray>/</gray><red><max-vl></red>"
  hover: |
    <gray>Jugador: <white><player>
    <gray>Check: <red><check>
    <gray>VL actual: <yellow><vl>/<max-vl>
    <gray>Ping: <white><ping>ms
    <gray>TPS: <white><tps>
    <gray>Versión: <white><version>
    <gray>Coords: <white><x>, <y>, <z>
    <gray>Servidor: <white><server>
    <newline><dark_gray>Click para teletransportarte

# Punishment messages
punishment:
  ban-screen: |
    <newline>
    <dark_purple>▬▬▬▬▬▬▬▬▬▬▬▬▬▬▬▬▬▬▬▬▬▬▬▬▬▬▬▬▬▬▬▬▬▬▬▬</dark_purple>
    <newline>
    <gradient:#6C63FF:#A78BFA><bold>     ZERAC - SANCIÓN</bold></gradient>
    <newline>
    <white>Has sido <red><bold>baneado</bold></red> del servidor
    <newline>
    <gray>  Razón: <red><reason>
    <gray>  Servidor: <white><server>
    <gray>  ID: <yellow>#<id>
    <newline>
    <dark_gray>Tu acceso fue detectado como ilegítimo.
    <dark_gray>Si crees que esto es un error, contacta:
    <newline>
    <aqua><bold>  discord.gg/zerac
    <newline>
    <dark_purple>▬▬▬▬▬▬▬▬▬▬▬▬▬▬▬▬▬▬▬▬▬▬▬▬▬▬▬▬▬▬▬▬▬▬▬▬</dark_purple>
    <newline>

  global-ban-screen: |
