# AntiVPN messages
anti-vpn:
  kicked: |
    <newline>
    <dark_purple>▬▬▬▬▬▬▬▬▬▬▬▬▬▬▬▬▬▬▬▬▬▬▬▬▬▬▬▬▬▬▬▬▬▬▬▬</dark_purple>
    <newline>
    <gradient:#6C63FF:#A78BFA><bold>     ZERAC - ANTI VPN</bold></gradient>
    <newline>
    <white>Tu conexión fue detectada como <red><bold>VPN/Proxy</bold></red>
    <newline>
    <gray>  IP: <red><ip>
    <gray>  Servidor: <white><server>
    <newline>
    <dark_gray>Desconecta tu VPN para acceder al servidor.
    <dark_gray>Si no usas VPN, contacta un administrador:
    <newline>
    <aqua><bold>  discord.gg/zerac
    <newline>
    <dark_purple>▬▬▬▬▬▬▬▬▬▬▬▬▬▬▬▬▬▬▬▬▬▬▬▬▬▬▬▬▬▬▬▬▬▬▬▬</dark_purple>
    <newline>

# Staff notifications
staff:
  alerts-enabled: "<prefix> <green>Alertas activadas."
  alerts-disabled: "<prefix> <red>Alertas desactivadas."
  debug-enabled: "<prefix> <green>Debug activado para <yellow><check></yellow>."
  debug-disabled: "<prefix> <red>Debug desactivado para <yellow><check></yellow>."
  vpn-detected: "<prefix> <gold><player></gold> <gray>detectado con VPN —</gray> <red><ip>"

# Commands
commands:
  stats: |
    <newline>
    <gradient:#6C63FF:#A78BFA><bold>  ZERAC Statistics</bold></gradient>
    <newline>
    <gray>  TPS: <green><tps>
    <gray>  Players: <white><players>
    <gray>  Total detections: <yellow><detections>
    <gray>  Total bans: <red><bans>
    <gray>  Uptime: <white><uptime>
    <gray>  Version: <white><version>
    <newline>

  blacklist-header: "<newline><gradient:#6C63FF:#A78BFA><bold>  ZERAC Global Blacklist</bold></gradient><newline>"
  blacklist-entry: "  <gray><index>. <gold><player></gold> <dark_gray>(<gray><uuid><dark_gray>)</dark_gray> — <red><reason>"
  blacklist-empty: "<prefix> <gray>La blacklist global está vacía."
  blacklist-added: "<prefix> <green><player> añadido a la blacklist global. ID: <yellow>#<id>"
  blacklist-removed: "<prefix> <green><player> removido de la blacklist global."
  blacklist-not-found: "<prefix> <red><player> no está en la blacklist global."

  check-header: "<newline><gradient:#6C63FF:#A78BFA><bold>  ZERAC — <player></bold></gradient><newline>"
  check-entry: "  <gray><check>: VL <yellow><vl></yellow><gray>/<red><max-vl></red> <dark_gray>(<gray>flags: <white><flags><dark_gray>)"
  check-clean: "<prefix> <green><player> no tiene flags activos."
